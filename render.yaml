# Render Blueprint for Swachh Setu / My Clean Navsari (SFIC 2026)
# Deploy all services with 1 click: Render Dashboard -> New -> Blueprint -> select this repo & branch (`umesh`)

databases:
  - name: swachh-setu-db
    plan: free
    databaseName: my_clean_navsari
    user: swachh_admin

services:
  # 1. Node.js + Express + PostgreSQL Backend API
  - type: web
    name: swachh-setu-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swachh-setu-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: swachh-setu-ml
          property: host

  # 2. FastAPI AI/ML Microservice (Lightweight Pillow + NumPy + Online k-NN for Render 512MB Free Tier)
  - type: web
    name: swachh-setu-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_TORCH
        value: "true"

  # 3. React + Vite + Tailwind Static Frontend
  - type: web
    name: swachh-setu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: swachh-setu-backend
          property: host
      - key: VITE_MAP_TILE_URL
        value: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
      - key: VITE_MAP_SUBDOMAINS
        value: a,b,c
